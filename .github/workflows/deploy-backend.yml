name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/ec2/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manga_record_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/manga_record_test
        run: python -m pytest -rs

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: backend
        env:
          ECR_REPO: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          docker build -t "$ECR_REPO:latest" .
          docker push "$ECR_REPO:latest"

      - name: Sync infra/ec2 files and deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # 先把 repo 的 infra/ec2/ 檔案寫到機器上（base64 傳入，避免跳脫問題），再執行 deploy.sh。
          # 先寫成 .new 再 mv，避免覆寫到正在執行中的腳本。
          SCRIPT="set -eu"$'\n'
          for f in compose.yml deploy.sh backup.sh setup-host.sh; do
            mode=644
            if [[ "$f" == *.sh ]]; then mode=755; fi
            SCRIPT+="echo $(base64 -w0 "infra/ec2/$f") | base64 -d > /opt/manga-record/$f.new"$'\n'
            SCRIPT+="chmod $mode /opt/manga-record/$f.new"$'\n'
            SCRIPT+="mv /opt/manga-record/$f.new /opt/manga-record/$f"$'\n'
          done
          SCRIPT+="/opt/manga-record/deploy.sh"
          PARAMS=$(jq -n --arg script "$SCRIPT" '{commands: ($script | split("\n"))}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          echo "=== deploy.sh stdout ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "=== deploy.sh stderr ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::deploy.sh did not finish successfully (status: $STATUS)"
            exit 1
          fi
